<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e1a">
<link rel="manifest" href="manifest.json">
<title>PhishGuard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;600&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0e1a;
    --bg-card: #111827;
    --bg-input: #0d1220;
    --neon-blue: #00d4ff;
    --neon-green: #00ff88;
    --neon-red: #ff3366;
    --neon-yellow: #ffaa00;
    --text: #e8eaf0;
    --text-dim: #8892a4;
    --border: #1e293b;
    --radius: 16px;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Heebo', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex; flex-direction: column;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── Header ── */
  header {
    padding: 20px 24px 12px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: rgba(10,14,26,0.95);
    backdrop-filter: blur(20px);
    position: sticky; top: 0; z-index: 10;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon { font-size: 28px; }
  .logo-text { font-size: 22px; font-weight: 800; color: var(--neon-blue); }
  .logo-sub { font-size: 11px; color: var(--text-dim); margin-top: -2px; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .settings-btn {
    background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    color: var(--text-dim); border-radius: 10px; padding: 6px 10px;
    font-size: 15px; cursor: pointer;
  }
  .status-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--neon-yellow); animation: pulse 2s infinite;
  }
  .status-dot.online { background: var(--neon-green); box-shadow: 0 0 10px rgba(0,255,136,0.5); }
  .status-dot.offline { background: var(--neon-red); box-shadow: 0 0 10px rgba(255,51,102,0.5); }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }

  /* ── Main ── */
  main { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }

  /* ── Settings drawer ── */
  .settings-card {
    background: var(--bg-card); border: 1px solid var(--neon-blue);
    border-radius: var(--radius); padding: 16px; display: none;
  }
  .settings-card.show { display: block; animation: fadeUp 0.3s ease; }
  .settings-card label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
  .settings-input {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg-input);
    color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 13px;
    direction: ltr; text-align: left; margin-bottom: 10px;
  }

  /* ── Input area ── */
  .input-section {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px;
  }
  .input-label {
    font-size: 15px; font-weight: 600; margin-bottom: 4px;
    display: flex; align-items: center; gap: 8px;
  }
  .input-hint { font-size: 13px; color: var(--text-dim); margin-bottom: 14px; }

  .paste-area {
    width: 100%; min-height: 120px; padding: 16px;
    background: var(--bg-input); border: 2px dashed var(--border);
    border-radius: 12px; color: var(--text); font-family: 'Heebo', sans-serif;
    font-size: 16px; line-height: 1.6; resize: none; outline: none;
    direction: rtl; transition: border-color 0.3s;
  }
  .paste-area:focus { border-color: var(--neon-blue); border-style: solid; }
  .paste-area::placeholder { color: #4a5568; }

  .btn-row { display: flex; gap: 10px; margin-top: 14px; }

  .btn {
    flex: 1; padding: 14px; border-radius: 12px; border: none;
    font-family: 'Heebo', sans-serif; font-size: 16px; font-weight: 700;
    cursor: pointer; transition: all 0.3s; display: flex;
    align-items: center; justify-content: center; gap: 8px;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--neon-blue), #0088cc);
    color: #fff;
  }
  .btn-primary:active { transform: scale(0.97); }
  .btn-primary:disabled { opacity: 0.4; }

  .btn-paste {
    background: rgba(0,212,255,0.08); border: 1px solid rgba(0,212,255,0.2);
    color: var(--neon-blue); flex: 0 0 auto; padding: 14px 16px;
  }
  .btn-paste:active { background: rgba(0,212,255,0.15); }

  .btn-clear {
    background: rgba(255,51,102,0.08); border: 1px solid rgba(255,51,102,0.2);
    color: var(--neon-red); flex: 0 0 auto; padding: 14px 16px;
  }
  .btn-clear:active { background: rgba(255,51,102,0.18); }

  /* ── Detected links ── */
  .detected-links {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; display: none;
  }
  .detected-links.show { display: block; animation: fadeUp 0.4s ease; }
  .detected-header {
    font-size: 14px; font-weight: 600; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px; color: var(--neon-blue);
  }
  .link-chip {
    display: flex; align-items: center; gap: 10px;
    background: rgba(0,0,0,0.3); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; margin-bottom: 8px;
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
    direction: ltr; text-align: left; word-break: break-all;
    transition: all 0.3s;
  }
  .link-chip .link-status { font-size: 18px; flex-shrink: 0; }

  /* ── Progress ── */
  .progress-section {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; display: none;
  }
  .progress-section.show { display: block; animation: fadeUp 0.4s ease; }
  .progress-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .progress-bar-bg {
    width: 100%; height: 6px; background: rgba(255,255,255,0.06);
    border-radius: 3px; overflow: hidden; margin-bottom: 12px;
  }
  .progress-bar {
    height: 100%; background: linear-gradient(90deg, var(--neon-blue), var(--neon-green));
    border-radius: 3px; transition: width 0.5s ease; width: 35%;
  }
  .progress-sub { font-size: 13px; color: var(--text-dim); }
  .spinner { animation: spin 1s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Result cards ── */
  .results-section { display: none; flex-direction: column; gap: 12px; }
  .results-section.show { display: flex; }

  .result-card {
    border-radius: var(--radius); padding: 20px;
    animation: fadeUp 0.5s ease;
  }
  .result-card.safe { background: rgba(0,255,136,0.05); border: 1px solid rgba(0,255,136,0.25); }
  .result-card.phishing { background: rgba(255,51,102,0.05); border: 1px solid rgba(255,51,102,0.25); }
  .result-card.suspicious { background: rgba(255,170,0,0.05); border: 1px solid rgba(255,170,0,0.25); }

  .result-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .result-verdict { font-size: 22px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
  .result-verdict.safe { color: var(--neon-green); }
  .result-verdict.phishing { color: var(--neon-red); }
  .result-verdict.suspicious { color: var(--neon-yellow); }

  .result-confidence {
    font-size: 13px; font-weight: 700; padding: 4px 10px;
    border-radius: 8px; font-family: 'JetBrains Mono', monospace;
  }
  .result-confidence.safe { background: rgba(0,255,136,0.1); color: var(--neon-green); }
  .result-confidence.phishing { background: rgba(255,51,102,0.1); color: var(--neon-red); }
  .result-confidence.suspicious { background: rgba(255,170,0,0.1); color: var(--neon-yellow); }

  .result-phase { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }

  .result-url {
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--text-dim); direction: ltr; text-align: left;
    word-break: break-all; margin-bottom: 12px;
    padding: 8px; background: rgba(0,0,0,0.2); border-radius: 8px;
  }

  .result-flags { display: flex; flex-direction: column; gap: 6px; }
  .flag {
    display: flex; align-items: flex-start; gap: 8px;
    font-size: 13px; color: var(--text-dim); padding: 6px 0;
    border-top: 1px solid rgba(255,255,255,0.05);
  }
  .flag-icon { flex-shrink: 0; font-size: 14px; margin-top: 1px; }

  /* ── Tip banner ── */
  .tip-banner {
    background: rgba(255,51,102,0.06); border: 1px solid rgba(255,51,102,0.2);
    border-radius: var(--radius); padding: 16px; display: none;
    text-align: center; animation: fadeUp 0.5s ease;
  }
  .tip-banner.show { display: block; }
  .tip-banner .tip-icon { font-size: 32px; margin-bottom: 6px; }
  .tip-banner .tip-text { font-size: 18px; font-weight: 800; color: var(--neon-red); }
  .tip-banner .tip-sub { font-size: 14px; color: var(--text-dim); margin-top: 4px; }

  .tip-banner.all-safe { background: rgba(0,255,136,0.06); border-color: rgba(0,255,136,0.2); }
  .tip-banner.all-safe .tip-text { color: var(--neon-green); }

  .tip-banner.warn { background: rgba(255,170,0,0.06); border-color: rgba(255,170,0,0.25); }
  .tip-banner.warn .tip-text { color: var(--neon-yellow); }

  /* ── History ── */
  .history-section {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin-top: 8px;
  }
  .history-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: var(--text-dim); }
  .history-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.03);
    font-size: 13px;
  }
  .history-item:last-child { border: none; }
  .history-url {
    font-family: 'JetBrains Mono', monospace; color: var(--text-dim);
    direction: ltr; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 70%;
  }
  .history-badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
  .history-badge.safe { background: rgba(0,255,136,0.1); color: var(--neon-green); }
  .history-badge.phishing { background: rgba(255,51,102,0.1); color: var(--neon-red); }
  .history-badge.suspicious { background: rgba(255,170,0,0.1); color: var(--neon-yellow); }

  @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  @supports (padding-bottom: env(safe-area-inset-bottom)) {
    main { padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-icon">🛡️</span>
    <div>
      <div class="logo-text">PhishGuard</div>
      <div class="logo-sub">סורק איומים בזמן אמת</div>
    </div>
  </div>
  <div class="header-right">
    <button class="settings-btn" onclick="toggleSettings()" title="הגדרות שרת">⚙️</button>
    <div class="status-dot" id="statusDot" title="בודק חיבור לשרת..."></div>
  </div>
</header>

<main>
  <!-- Settings -->
  <div class="settings-card" id="settingsCard">
    <label for="apiBaseInput">כתובת שרת ה־Backend (FastAPI):</label>
    <input class="settings-input" id="apiBaseInput" type="url" placeholder="http://localhost:8000" />
    <button class="btn btn-primary" style="padding:10px;font-size:14px;" onclick="saveSettings()">💾 שמור ובדוק חיבור</button>
  </div>

  <!-- Input Section -->
  <div class="input-section">
    <div class="input-label">📩 הדביקו הודעה או קישור</div>
    <div class="input-hint">העתיקו הודעת SMS חשודה והדביקו כאן — השרת ינתח את הקישור בבידוד מלא</div>
    <textarea class="paste-area" id="pasteArea" placeholder="לדוגמה:
שלום, חשבון הבנק שלך ננעל. לחץ כאן לשחרור:
https://example.com"></textarea>
    <div class="btn-row">
      <button class="btn btn-clear" id="clearBtn" onclick="clearAll()" title="נקה טקסט">🗑️ נקה</button>
      <button class="btn btn-paste" id="pasteBtn" onclick="clearAndPaste()" title="מחק מלל קיים והדבק חדש">📋 נקה והדבק</button>
      <button class="btn btn-primary" id="scanBtn" onclick="startScan()">🔍 בדוק עכשיו</button>
    </div>
  </div>

  <!-- Detected Links -->
  <div class="detected-links" id="detectedLinks">
    <div class="detected-header">🔗 קישורים שנמצאו בהודעה:</div>
    <div id="linksList"></div>
  </div>

  <!-- Progress -->
  <div class="progress-section" id="progressSection">
    <div class="progress-title"><span class="spinner">⚙️</span> השרת מנתח את הקישור...</div>
    <div class="progress-bar-bg"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-sub" id="progressSub">בודק מול VirusTotal, URLScan.io ומנוע האבטחה...</div>
  </div>

  <!-- Tip Banner -->
  <div class="tip-banner" id="tipBanner">
    <div class="tip-icon" id="tipIcon"></div>
    <div class="tip-text" id="tipText"></div>
    <div class="tip-sub" id="tipSub"></div>
  </div>

  <!-- Results -->
  <div class="results-section" id="resultsSection"></div>

  <!-- History -->
  <div class="history-section" id="historySection" style="display:none">
    <div class="history-title">📜 היסטוריית בדיקות</div>
    <div id="historyList"></div>
  </div>
</main>

<script>
const URL_REGEX = /https?:\/\/[^\s<>"')\]،,]+/gi;
let scanHistory = JSON.parse(localStorage.getItem('phishguard_history') || '[]');

function getApiBase() {
  const saved = localStorage.getItem('phishguard_api_base');
  if (saved !== null) return saved.replace(/\/+$/, '');
  if (location.protocol.startsWith('http') && !location.hostname.endsWith('github.io')) {
    return '';
  }
  return 'http://localhost:8000';
}

document.getElementById('apiBaseInput').value = getApiBase() || location.origin;

function toggleSettings() {
  document.getElementById('settingsCard').classList.toggle('show');
}

async function saveSettings() {
  const val = document.getElementById('apiBaseInput').value.trim().replace(/\/+$/, '');
  localStorage.setItem('phishguard_api_base', val);
  document.getElementById('settingsCard').classList.remove('show');
  await checkHealth();
}

async function checkHealth() {
  const dot = document.getElementById('statusDot');
  try {
    const res = await fetch(`${getApiBase()}/api/v1/health`, { method: 'GET' });
    if (res.ok) {
      dot.className = 'status-dot online';
      dot.title = 'מחובר לשרת PhishGuard';
      return true;
    }
  } catch {}
  dot.className = 'status-dot offline';
  dot.title = 'אין חיבור לשרת Backend';
  return false;
}

checkHealth();
renderHistory();

function clearAll() {
  const area = document.getElementById('pasteArea');
  area.value = '';
  document.getElementById('detectedLinks').classList.remove('show');
  document.getElementById('linksList').innerHTML = '';
  document.getElementById('resultsSection').classList.remove('show');
  document.getElementById('resultsSection').innerHTML = '';
  document.getElementById('tipBanner').classList.remove('show');
  area.focus();
}

async function clearAndPaste() {
  clearAll();
  try {
    const text = await navigator.clipboard.readText();
    if (text) {
      document.getElementById('pasteArea').value = text;
      detectLinks(text);
    }
  } catch {
    document.getElementById('pasteArea').focus();
  }
}

document.getElementById('pasteArea').addEventListener('input', (e) => {
  detectLinks(e.target.value);
});

function detectLinks(text) {
  const links = text.match(URL_REGEX) || [];
  const container = document.getElementById('detectedLinks');
  const list = document.getElementById('linksList');

  if (links.length === 0) {
    container.classList.remove('show');
    return;
  }

  list.innerHTML = links.map(url =>
    `<div class="link-chip"><span class="link-status">🔗</span><span>${escapeHtml(url)}</span></div>`
  ).join('');
  container.classList.add('show');
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function phaseLabel(phase) {
  const map = {
    static_api_check: 'שלב 1: בדיקת מאגרי מודיעין (Static API)',
    dynamic_sandbox: 'שלב 2: ניתוח דינמי ב־Sandbox',
    heuristic_engine: 'שלב 3: מנוע החלטה היוריסטי',
  };
  return map[phase] || phase;
}

function verdictMeta(verdict) {
  const v = (verdict || '').toLowerCase();
  if (v === 'phishing') return { label: '🚨 פישינג', cls: 'phishing', icon: '🚨' };
  if (v === 'safe') return { label: '✅ בטוח', cls: 'safe', icon: '✅' };
  return { label: '⚠️ חשוד', cls: 'suspicious', icon: '⚠️' };
}

function buildFlags(data) {
  const flags = [];

  if (Array.isArray(data.threat_intel)) {
    for (const ti of data.threat_intel) {
      if (ti.error === 'API key not configured.') continue;
      if (ti.malicious === true) {
        flags.push({ icon: '🚨', text: `${ti.provider}: זוהה כזדוני (ציון ${Math.round((ti.score || 0) * 100)}%)` });
      } else if (ti.malicious === false) {
        flags.push({ icon: '✅', text: `${ti.provider}: נקי` });
      } else if (ti.error) {
        flags.push({ icon: '⚠️', text: `${ti.provider}: ${ti.error}` });
      } else {
        flags.push({ icon: 'ℹ️', text: `${ti.provider}: לא נמצא מידע קודם במאגר` });
      }
    }
  }

  if (data.dynamic) {
    if (data.dynamic.final_url && data.dynamic.final_url !== data.submitted_url) {
      flags.push({ icon: '🔄', text: `יעד סופי לאחר הפניה: ${data.dynamic.final_url}` });
    }
    if (data.dynamic.whois && data.dynamic.whois.domain_age_days != null) {
      flags.push({ icon: '📅', text: `גיל הדומיין: ${data.dynamic.whois.domain_age_days} ימים` });
    }
    if (data.dynamic.ssl && data.dynamic.ssl.organization) {
      flags.push({ icon: '🔒', text: `תעודת SSL: ${data.dynamic.ssl.organization}` });
    }
  }

  if (Array.isArray(data.heuristic_flags)) {
    for (const f of data.heuristic_flags) {
      flags.push({ icon: '⚠️', text: f.description });
    }
  }

  return flags;
}

async function startScan() {
  const text = document.getElementById('pasteArea').value.trim();
  if (!text) return;

  const urls = [...new Set(text.match(URL_REGEX) || [])];
  if (urls.length === 0) {
    alert('לא נמצאו קישורים בהודעה. נסו להדביק הודעה עם קישור.');
    return;
  }

  const btn = document.getElementById('scanBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner">⚙️</span> בודק...';

  const prog = document.getElementById('progressSection');
  const progBar = document.getElementById('progressBar');
  const resultsEl = document.getElementById('resultsSection');
  const tip = document.getElementById('tipBanner');

  prog.classList.add('show');
  progBar.style.width = '20%';
  resultsEl.classList.remove('show');
  resultsEl.innerHTML = '';
  tip.classList.remove('show');

  let hasPhishing = false;
  let hasSuspicious = false;
  let completed = 0;

  try {
    for (let i = 0; i < urls.length; i++) {
      const url = urls[i];
      document.getElementById('progressSub').textContent = `סורק (${i + 1}/${urls.length}): ${url}`;
      progBar.style.width = `${Math.round(((i + 0.5) / urls.length) * 100)}%`;

      const res = await fetch(`${getApiBase()}/api/v1/analyze-url`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `שגיאת שרת (${res.status})`);
      }

      const data = await res.json();
      completed++;
      progBar.style.width = `${Math.round((completed / urls.length) * 100)}%`;

      const meta = verdictMeta(data.verdict);
      if (meta.cls === 'phishing') hasPhishing = true;
      if (meta.cls === 'suspicious') hasSuspicious = true;

      const flags = buildFlags(data);
      const confPct = Math.round((data.confidence || 0) * 100);

      const card = document.createElement('div');
      card.className = 'result-card ' + meta.cls;
      card.innerHTML = `
        <div class="result-header">
          <div class="result-verdict ${meta.cls}">${meta.label}</div>
          <div class="result-confidence ${meta.cls}">${confPct}%</div>
        </div>
        <div class="result-phase">${escapeHtml(phaseLabel(data.decided_in_phase))}</div>
        <div class="result-url">${escapeHtml(data.submitted_url)}</div>
        <div class="result-flags">
          ${flags.map(f => `<div class="flag"><span class="flag-icon">${f.icon}</span><span>${escapeHtml(f.text)}</span></div>`).join('')}
        </div>
      `;
      resultsEl.appendChild(card);

      addToHistory(data.submitted_url, data.verdict, meta.cls);

      const chips = document.querySelectorAll('.link-chip');
      if (chips[i]) chips[i].querySelector('.link-status').textContent = meta.icon;
    }

    resultsEl.classList.add('show');

    if (hasPhishing) {
      tip.className = 'tip-banner show';
      document.getElementById('tipIcon').textContent = '🚫';
      document.getElementById('tipText').textContent = 'אל תלחצו על הקישור!';
      document.getElementById('tipSub').textContent = 'זוהה קישור פישינג. מחקו את ההודעה.';
    } else if (hasSuspicious) {
      tip.className = 'tip-banner warn show';
      document.getElementById('tipIcon').textContent = '⚠️';
      document.getElementById('tipText').textContent = 'הקישור חשוד או לא מאומת';
      document.getElementById('tipSub').textContent = 'אל תזינו פרטים אישיים בלי לוודא את מקור ההודעה.';
    } else {
      tip.className = 'tip-banner all-safe show';
      document.getElementById('tipIcon').textContent = '👍';
      document.getElementById('tipText').textContent = 'הקישורים נראים בטוחים';
      document.getElementById('tipSub').textContent = 'לא זוהו איומים במאגרי המודיעין.';
    }
  } catch (err) {
    tip.className = 'tip-banner warn show';
    document.getElementById('tipIcon').textContent = '🔌';
    document.getElementById('tipText').textContent = 'לא ניתן להתחבר לשרת הסריקה';
    document.getElementById('tipSub').textContent = `${err.message} — בדקו שהשרת פועל או לחצו ⚙️ להגדרת כתובת השרת.`;
  } finally {
    prog.classList.remove('show');
    btn.disabled = false;
    btn.innerHTML = '🔍 בדוק עכשיו';
    checkHealth();
  }
}

function addToHistory(url, verdict, cls) {
  scanHistory.unshift({ url, verdict, cls, time: new Date().toLocaleTimeString('he-IL') });
  if (scanHistory.length > 20) scanHistory.pop();
  localStorage.setItem('phishguard_history', JSON.stringify(scanHistory));
  renderHistory();
}

function renderHistory() {
  const section = document.getElementById('historySection');
  const list = document.getElementById('historyList');
  if (scanHistory.length === 0) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  list.innerHTML = scanHistory.slice(0, 10).map(h => `
    <div class="history-item">
      <span class="history-url">${escapeHtml(h.url)}</span>
      <span class="history-badge ${h.cls}">${escapeHtml(h.verdict)}</span>
    </div>
  `).join('');
}
</script>
